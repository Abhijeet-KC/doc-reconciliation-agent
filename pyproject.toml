[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sunbridge"
version = "0.1.0"
description = "SunBridge Compliance Pipeline"
authors = [{ name = "AI Engineer" }]
dependencies = [
    "langgraph>=0.1.0",
    "pydantic>=2.0.0",
    "PyMuPDF>=1.23.0",
    "httpx>=0.25.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0"
]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
